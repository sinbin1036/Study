name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: book_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: book_db
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Run tests
        run: mvn -B test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: book_db
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
